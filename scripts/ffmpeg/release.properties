# The published audio-only ffmpeg that desktop/build.ps1 and
# android/app/build.gradle.kts download. Written after running the `ffmpeg`
# workflow with a tag: copy the tag and the SHA-256 of each zip from the job
# summary. Leave empty to build only against a local copy (-FfmpegDir for the
# installer, -PffmpegDir for the APK).
tag=
win64.sha256=
android-arm64.sha256=
