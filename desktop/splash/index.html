<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spitifo</title>
    <!-- Shown only while the backend starts; the shell then navigates the
         window to the backend, which serves the real UI. -->
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        background: #0e0f12; color: #e8e8ec;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main { text-align: center; max-width: 32rem; padding: 0 16px; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { margin: 0; color: #9a9aa5; }
      #error { display: none; color: #ff8a8a; white-space: pre-wrap; margin-top: 1rem; }
      body.failed #status { display: none; }
      body.failed #error { display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>Spitifo</h1>
      <p id="status">Iniciando…</p>
      <p id="error"></p>
    </main>
    <script>
      // Called by the shell through `eval` when the backend cannot start.
      window.spitifoFailed = (message) => {
        document.getElementById("error").textContent = message;
        document.body.classList.add("failed");
      };
    </script>
  </body>
</html>
