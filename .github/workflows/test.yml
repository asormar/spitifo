name: test

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml, which needs the suite to pass before it builds.
  workflow_call:

concurrency:
  # Keyed on the ref alone: the group must never match a caller workflow's, or
  # a superseded run would cancel the run that called it.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # ffmpeg is a runtime requirement; without it the conversion tests skip
      # and test_ffmpeg_esta_disponible fails.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Offline only: -m "not integration" skips the tests that hit the network.
      - name: Run the test suite
        run: python -m pytest -m "not integration"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      # Fails when the JS or CSS bundle is over its budget in
      # scripts/perf/budgets.json (docs/performance.md).
      - name: Check the bundle size
        run: node scripts/perf/check_size.mjs bundle frontend/dist
