org.gradle.jvmargs=-Xmx2g
# The release app uses no androidx: it is a plain Activity + WebView, and the
# ffmpeg AAR is consumed as a normal dependency (see app/build.gradle.kts).
# Enabled because the debug-only Google sign-in probe pulls play-services-auth,
# which depends on androidx; the release classpath is unchanged.
android.useAndroidX=true
android.nonTransitiveRClass=true
