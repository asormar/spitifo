[pytest]
# IMPRESCINDIBLE: sin esto pytest tambien colecta los 4 scripts sueltos de la
# raiz (smoke_test.py, test_convert.py, test_wav.py, test_ytdlp_flow.py), que
# llaman asyncio.run() a NIVEL DE MODULO -> RuntimeError al collection y la
# suite entera no arranca. Ademas esos scripts no son tests: solo imprimen.
testpaths = tests

pythonpath = .

addopts = -ra --strict-markers

markers =
    integration: el test pega a una API externa (iTunes, archive.org, Wikimedia,
        YouTube) o baja archivos de verdad. Puede fallar por causa externa, por
        eso se corren aparte: `pytest -m "not integration"` (rapido, offline) y
        `pytest` (todo).

# Si un test se cuelga en vez de fallar, que muera y lo diga en vez de dejar la
# corrida colgada para siempre. pytest-timeout va por test con
# @pytest.mark.timeout(N); aca hay un piso general para lo que no lo lleve.
timeout = 120
